# filebeat config - ship suricata and cowrie logs to logstash

filebeat.inputs:

  # suricata eve.json
  - type: log
    enabled: true
    paths:
      - /var/log/suricata/eve.json
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      source: suricata
    fields_under_root: false

  # cowrie json log
  - type: log
    enabled: true
    paths:
      - /opt/cowrie/var/log/cowrie/cowrie.json
    json.keys_under_root: true
    json.add_error_key: true
    fields:
      source: cowrie
    fields_under_root: false

output.logstash:
  hosts: ["localhost:5044"]
  bulk_max_size: 1024

# internal queue
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 3
  permissions: 0644

# avoid sending filebeat's own monitoring data
monitoring.enabled: false
