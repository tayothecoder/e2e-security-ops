# logstash pipeline for suricata and cowrie logs

input {
  beats {
    port => 5044
  }
}

filter {
  # route based on the source field filebeat adds
  if [fields][source] == "suricata" {
    # suricata eve.json is already parsed by filebeat's json processor
    # but we do some extra normalisation here

    mutate {
      add_field => { "[@metadata][index]" => "suricata" }
    }

    # parse the timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }

    # extract geoip from source ip if available
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "src_geo"
      }
    }

    # tag alerts by severity for easy filtering
    if [event_type] == "alert" {
      if [alert][severity] == 1 {
        mutate { add_tag => ["critical"] }
      } else if [alert][severity] == 2 {
        mutate { add_tag => ["warning"] }
      } else {
        mutate { add_tag => ["info"] }
      }
    }
  }

  else if [fields][source] == "cowrie" {
    mutate {
      add_field => { "[@metadata][index]" => "cowrie" }
    }

    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }

    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "src_geo"
      }
    }

    # tag login events
    if [eventid] =~ /^cowrie\.login\.(success|failed)$/ {
      mutate { add_tag => ["auth_event"] }
    }

    # tag command input
    if [eventid] == "cowrie.command.input" {
      mutate { add_tag => ["command"] }
    }

    # tag file downloads
    if [eventid] == "cowrie.session.file_download" {
      mutate { add_tag => ["file_download"] }
    }
  }

  else {
    # unknown source, just pass through
    mutate {
      add_field => { "[@metadata][index]" => "misc" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "secops-%{[@metadata][index]}-%{+YYYY.MM.dd}"
  }
}
