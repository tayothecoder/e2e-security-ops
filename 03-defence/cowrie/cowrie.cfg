# cowrie honeypot configuration

[honeypot]
hostname = web-prod-01
log_path = var/log/cowrie
download_path = var/lib/cowrie/downloads
ttylog_path = var/lib/cowrie/ttylog
contents_path = honeyfs
txtcmds_path = txtcmds
share_path = share/cowrie

# fake kernel version to look convincing
kernel_version = 5.15.0-91-generic
kernel_build_string = #101-Ubuntu SMP Tue Nov 14 13:30:08 UTC 2023
hardware_platform = x86_64
operating_system = GNU/Linux

# interactive timeout in seconds
interactive_timeout = 300
authentication_timeout = 120

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6

# forward to real shell? no, we want the fake one
forward_redirect = false

[telnet]
enabled = true
listen_endpoints = tcp:2323:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json

[output_textlog]
enabled = true
logfile = var/log/cowrie/cowrie.log

# if you want to forward to an elk stack directly
#[output_elasticsearch]
#enabled = true
#host = localhost
#port = 9200
#index = cowrie

[shell]
# filesystem image
filesystem = share/cowrie/fs.pickle

[proxy]
enabled = false
